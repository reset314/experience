services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: experience
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/experience
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EXPERIENCE_MINIO_ENDPOINT: http://minio:9000
      EXPERIENCE_MINIO_ACCESS_KEY: minioadmin
      EXPERIENCE_MINIO_SECRET_KEY: minioadmin
      EXPERIENCE_INITIAL_ADMIN_USERNAME: admin
      EXPERIENCE_INITIAL_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"

volumes:
  pg_data:
  minio_data:
